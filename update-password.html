<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100d1c">

  <title>Update Password | SocialPlug</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #100d1c;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      display: block;
      margin-bottom: 28px;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 30px;
      font-weight: 900;
    }

    .brand span {
      color: #facc15;
    }

    .card {
      padding: 30px 24px;
      border: 1px solid #332c49;
      border-radius: 22px;
      background: #1b172b;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 27px;
    }

    .description {
      margin-bottom: 24px;
      color: #aaa5bd;
      font-size: 14px;
      line-height: 1.7;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 49px;
      padding: 13px;
      border: 1px solid #332c49;
      border-radius: 11px;
      outline: none;
      background: #120f20;
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      border-color: #8b5cf6;
    }

    .help {
      margin-top: 7px;
      color: #aaa5bd;
      font-size: 12px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 50px;
      padding: 13px;
      border: none;
      border-radius: 11px;
      background: #facc15;
      color: #17120a;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .success {
      display: block;
      color: #4ade80;
      background: #14271e;
    }

    .error {
      display: block;
      color: #fb7185;
      background: #301720;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 13px;
    }

    .footer a {
      color: #facc15;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <a class="brand" href="/">Social<span>Plug</span></a>

    <section class="card">
      <h1>Choose a new password</h1>

      <p class="description">
        Enter a new password for your SocialPlug account.
      </p>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

      <form id="updateForm">
        <div class="form-group">
          <label for="password">New password</label>

          <input
            id="password"
            type="password"
            minlength="10"
            autocomplete="new-password"
            placeholder="Enter your new password"
            required
          >

          <p class="help">
            Use at least 10 characters and avoid reusing another site's password.
          </p>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm new password</label>

          <input
            id="confirmPassword"
            type="password"
            minlength="10"
            autocomplete="new-password"
            placeholder="Enter the password again"
            required
          >
        </div>

        <button id="updateButton" type="submit">
          Update Password
        </button>
      </form>

      <p class="footer">
        <a href="/login.html">Back to Login</a>
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase.js"></script>

  <script>
    const form = document.getElementById("updateForm");
    const message = document.getElementById("message");
    const button = document.getElementById("updateButton");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    async function checkRecoverySession() {
      try {
        const { data, error } =
          await socialPlugSupabase.auth.getSession();

        if (error || !data.session) {
          form.hidden = true;

          showMessage(
            "This reset link is invalid, expired, or already used. Request a new reset link from the login page.",
            "error"
          );

          return false;
        }

        return true;
      } catch (error) {
        form.hidden = true;

        showMessage(
          "Unable to verify your reset session. Request a new reset link and try again.",
          "error"
        );

        return false;
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password.length < 10) {
        showMessage(
          "Your password must contain at least 10 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Your passwords do not match.", "error");
        return;
      }

      button.disabled = true;
      button.textContent = "Updating...";

      try {
        const validSession = await checkRecoverySession();

        if (!validSession) {
          return;
        }

        const { error } = await socialPlugSupabase.auth.updateUser({
          password: password
        });

        if (error) {
          throw error;
        }

        await socialPlugSupabase.auth.signOut();

        form.reset();
        form.hidden = true;

        showMessage(
          "Your password has been updated. You can now log in with your new password.",
          "success"
        );

        const link = document.createElement("a");
        link.href = "/login.html";
        link.textContent = "Go to Login";
        link.style.display = "block";
        link.style.marginTop = "14px";
        link.style.color = "#facc15";
        link.style.textAlign = "center";

        message.appendChild(document.createElement("br"));
        message.appendChild(link);

      } catch (error) {
        showMessage(
          error.message || "Unable to update your password. Request a new reset link and try again.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Update Password";
      }
    });

    checkRecoverySession();
  </script>
</body>
</html>
