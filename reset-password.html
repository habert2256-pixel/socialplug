<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100d1c">

  <title>Reset Password | SocialPlug</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #100d1c;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      display: block;
      margin-bottom: 28px;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-size: 30px;
      font-weight: 900;
    }

    .brand span {
      color: #facc15;
    }

    .card {
      padding: 30px 24px;
      border: 1px solid #332c49;
      border-radius: 22px;
      background: #1b172b;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 27px;
    }

    .description {
      margin-bottom: 24px;
      color: #aaa5bd;
      font-size: 14px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 49px;
      margin-bottom: 18px;
      padding: 13px;
      border: 1px solid #332c49;
      border-radius: 11px;
      outline: none;
      background: #120f20;
      color: white;
      font-size: 15px;
    }

    input:focus {
      border-color: #8b5cf6;
    }

    button {
      width: 100%;
      min-height: 50px;
      border: none;
      border-radius: 11px;
      background: #facc15;
      color: #17120a;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .success {
      display: block;
      color: #4ade80;
      background: #14271e;
    }

    .error {
      display: block;
      color: #fb7185;
      background: #301720;
    }

    .footer {
      margin-top: 22px;
      text-align: center;
      font-size: 13px;
    }

    .footer a {
      color: #facc15;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="container">
    <a class="brand" href="/">Social<span>Plug</span></a>

    <section class="card">
      <h1>Forgot your password?</h1>

      <p class="description">
        Enter the email address associated with your account.
        We'll request a password-reset link for you.
      </p>

      <div
        id="message"
        class="message"
        role="status"
        aria-live="polite"
      ></div>

      <form id="resetForm">
        <label for="email">Email address</label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <button id="resetButton" type="submit">
          Send Reset Link
        </button>
      </form>

      <p class="footer">
        <a href="/login.html">← Back to Login</a>
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase.js"></script>

  <script>
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");
    const button = document.getElementById("resetButton");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = document.getElementById("email").value.trim();

      button.disabled = true;
      button.textContent = "Sending...";

      try {
        if (typeof socialPlugSupabase === "undefined") {
          throw new Error("Supabase is not configured correctly.");
        }

        const { error } = await socialPlugSupabase.auth
          .resetPasswordForEmail(email, {
            redirectTo:
              window.location.origin + "/update-password.html"
          });

        if (error) {
          throw error;
        }

        showMessage(
          "If an account matches that email, a password-reset email will be sent. Check your inbox and spam folder.",
          "success"
        );

      } catch (error) {
        showMessage(
          error.message || "Unable to send the reset email. Please try again.",
          "error"
        );
      } finally {
        button.disabled = false;
        button.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
